<style>
:root{
  
  color-scheme: light;

  
  --col-w:720px;
  --sat:env(safe-area-inset-top, 0px);
  --sab:env(safe-area-inset-bottom, 0px);
  --bg:#FFFFFF;
  --surface:#F7F5F0;
  --surface-raised:#FFFFFF;
  --border:#E6E1D6;
  --border-soft:#EFEBE1;
  --text:#1B1712;
  --text-muted:#75695A;
  --text-faint:#6E6455;

  --canon:#B8792A;
  --canon-soft:#F2E3C6;
  --canon-deep:#875816;

  
  --login-accent:#B8792A;
  --login-accent-soft:#F2E3C6;

  
  --status-ongoing:#7A8B4E;
  --status-ongoing-soft:#DFEAE2;
  --status-ongoing-deep:#2C4736;
  --status-hiatus:#A66A3D;
  --status-hiatus-soft:#F4DDD7;
  --status-hiatus-deep:#753D35;

  --voice:#3C6B54;
  --voice-soft:#DEEAE2;
  --voice-deep:#274A39;

  --alert:#B24B3C;
  --alert-soft:#F5DDD7;
  --alert-deep:#8A362A;

  --plum:#7A5C8F;
  --plum-soft:#EBE1F0;
  --plum-deep:#5C4270;

  --azure:#3D6E8C;
  --azure-soft:#DCE8EE;
  --azure-deep:#2C5470;

  --rose:#A85C6B;
  --rose-soft:#F5DFE1;
  --rose-deep:#7D3D49;

  
  --slate:#6E6A63;
  --slate-soft:#E9E6DE;
  --slate-deep:#4A463F;

  --shadow: 0 1px 2px rgba(27,23,18,0.04), 0 6px 20px rgba(27,23,18,0.06);
  --shadow-lg: 0 8px 30px rgba(27,23,18,0.12), 0 2px 8px rgba(27,23,18,0.08);
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:22px;

  --font-display:'Fraunces', serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}
html[data-theme="dark"]{
  color-scheme: dark;
  
  --bg:#0E1013;
  --surface:#171A1F;
  --surface-raised:#1F2329;
  --border:#2B3038;
  --border-soft:#22262D;
  --text:#ECEAE4;
  --text-muted:#A3A6AD;
  --text-faint:#898D96;

  --canon:#DDA34C;
  --canon-soft:#2E2A1E;
  --canon-deep:#F0C27E;

  --login-accent:#DDA34C;
  --login-accent-soft:#3A2C15;

  --status-ongoing:#A9BC7C;
  --status-ongoing-soft:#1D2D23;
  --status-ongoing-deep:#A3C7AF;
  --status-hiatus:#D6A06A;
  --status-hiatus-soft:#33201A;
  --status-hiatus-deep:#E2A799;

  --voice:#7FB89A;
  --voice-soft:#1E2C24;
  --voice-deep:#9ED0B4;

  --alert:#D97A67;
  --alert-soft:#33201B;
  --alert-deep:#EDA294;

  --plum:#B08FC4;
  --plum-soft:#2A2033;
  --plum-deep:#D3B8E3;

  --azure:#7FAFC7;
  --azure-soft:#1B2A30;
  --azure-deep:#A8D3E8;

  --rose:#D99AA8;
  --rose-soft:#33202A;
  --rose-deep:#E8B5C0;

  --slate:#A79C8A;
  --slate-soft:#2A2519;
  --slate-deep:#D8D0BE;

  --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 6px 20px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.3);
}
html[data-accent="rosewood"]{
  --canon:#7A2E35;
  --canon-soft:#F3DCDA;
  --canon-deep:#5C1F26;
}
html[data-theme="dark"][data-accent="rosewood"]{
  --canon:#D98A90;
  --canon-soft:#3A2020;
  --canon-deep:#EFB4B8;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; height:100dvh; overflow:hidden;}
html{ background:var(--bg); }
.section-pad, .is-scroll, .canon-select-list, .link-checkbox-group,
.involvement-group, .write-preview, .chat-scroll, .pub-scroll,
.pub-reader-body, .pub-viewers-body,
[style*="overflow-y:auto"], [style*="overflow-y: auto"],
[style*="overflow:auto"], [style*="overflow: auto"] {
  overscroll-behavior: contain;
}
*{ scrollbar-width:none; -ms-overflow-style:none; }
*::-webkit-scrollbar{ display:none; width:0; height:0; }
@media (prefers-reduced-motion: reduce){
*, *::before, *::after{
    animation-duration:0.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.001ms !important;
    scroll-behavior:auto !important;
  }
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  transition:background 0.25s ease, color 0.25s ease;
  -webkit-user-select:none; user-select:none;
}
button{font-family:inherit; cursor:pointer;}
input,textarea,select{font-family:inherit;}
input, textarea, .write-body{
  -webkit-user-select:text; user-select:text;
}
.icon{width:20px; height:20px; display:inline-block; flex-shrink:0;}
.icon svg{width:100%; height:100%; display:block;}
#app{
  max-width:560px;
  margin:0 auto;
  position:fixed;
  inset:0;
  overflow:hidden;
  background:var(--bg);
  display:flex;
  flex-direction:column;
}
.view{ display:none; flex-direction:column; flex:1; min-height:0; }
.view.active{ animation:viewIn 0.14s ease-out both; }
.view.active{ display:flex; }
#app[data-static] .view.active, #app[data-static] .book-tile{ animation:none !important; }
.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; gap:10px;
  padding:calc(var(--sat) + 14px) 18px 12px;
  background:var(--bg);
  border-bottom:1px solid var(--border-soft);
}
.topbar .tb-title{
  font-family:var(--font-display); font-weight:600; font-size:19px;
  flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.tb-btn{
  width:40px; height:40px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:var(--surface); border:1px solid var(--border-soft); color:var(--text);
  transition:transform 0.1s ease, background 0.15s ease;
}
.tb-btn:active{ background:var(--surface-raised); transform:scale(0.90); }
.tb-btn.filled{ background:var(--canon); border-color:transparent; color:#fff; }
.tb-btn.hidden{ display:none; }
.tb-btn.tb-pill-btn{ width:auto; height:auto; min-width:40px; min-height:40px; border-radius:99px; padding:0 4px; background:none; border:none; flex-shrink:0; }
.tb-btn.tb-pill-btn:active{ background:none; }
.shelf{
  
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px;
  padding:18px 22px 100px;
}
.book-tile{
  min-width:0;
  display:flex; flex-direction:column; gap:8px;
  animation:riseIn 0.4s ease both;
  transition:transform 0.1s ease, opacity 0.1s ease;
}
.book-tile:active{ transform:scale(0.97); opacity:0.85; }
.book-cover{
  position:relative; aspect-ratio:2/3; border-radius:var(--radius-s);
  overflow:hidden; background:var(--surface); border:1px solid var(--border-soft);
  box-shadow:var(--shadow);
  display:flex; align-items:flex-end;
}
.book-cover img{ width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
.book-cover .fallback-label{
  position:relative; z-index:1; padding:14px; font-family:var(--font-display);
  font-weight:600; font-size:15px; color:#fff; line-height:1.25;
}
.book-cover .cover-placeholder{
  width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  color:var(--text-faint);
}
.book-cover .spine-shade{
  position:absolute; inset:0; background:linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.55) 100%);
}
.cover-wrap{ position:relative; }
.book-meta .b-title{
  font-family:var(--font-display); font-weight:600; font-size:14px; line-height:1.3;

  overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
}
.book-meta .b-sub{
  font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); margin-top:2px;
}
.book-meta .b-sub.tile-stats{ display:flex; flex-direction:column; gap:2px; }
.book-meta .b-sub.tile-stats .stat{ display:flex; align-items:center; gap:4px; }
.book-meta .b-sub.tile-stats .stat .icon{ width:11px; height:11px; }
.count-pill{ font-family:var(--font-mono); font-size:11px; color:var(--text-muted); background:var(--surface); border:1px solid var(--border-soft); border-radius:99px; padding:3px 9px; display:inline-flex; align-items:center; gap:5px; transition:background .3s,color .3s; }
html:not([data-theme="dark"]) #tabBody .card, html:not([data-theme="dark"]) #tabBody .tool-tile{ border-color:color-mix(in srgb, var(--canon) 16%, var(--border-soft)); box-shadow:0 8px 18px -12px color-mix(in srgb, var(--canon) 38%, transparent), 0 1px 2px rgba(60,40,10,.06); }
html[data-theme="dark"] #tabBody > .section-pad{ background:var(--bg); }
html[data-theme="dark"] #tabBody .card, html[data-theme="dark"] #tabBody .tool-tile{ border-color:var(--border); box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 1px 2px rgba(0,0,0,.35); }
.book-meta .b-sub.tile-stats .status-pill{ align-self:flex-start; margin-bottom:2px; }
.book-meta .b-sub.tile-meta{ gap:3px; }
.meta-line{ display:flex; align-items:center; gap:6px; min-width:0; color:var(--text-muted); }
.meta-line .ml-text{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.meta-edited{ color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.st-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; background:var(--text-faint); }
.st-dot.status-ongoing{ background:var(--status-ongoing-deep); }
.st-dot.status-hiatus{ background:var(--status-hiatus-deep); }
.st-dot.canon{ background:var(--canon); }
.book-row-stats.row-meta{ flex-direction:column; align-items:flex-start; gap:3px; }
.book-row-stats .status-pill{ margin-right:2px; }
.empty-state{
  margin:40px 20px; text-align:center; padding:36px 20px;
  border:1px dashed var(--border); border-radius:var(--radius-m); color:var(--text-muted);
}
.empty-state .icon{ width:30px; height:30px; margin:0 auto 10px; color:var(--text-faint); }
.empty-state h3{ font-family:var(--font-display); font-size:17px; margin:0 0 4px; color:var(--text); }
.empty-state p{ font-size:13px; margin:0; }
.bottom-nav{
  position:sticky; bottom:0; z-index:20;
  display:flex; background:var(--bg);
  border-top:1px solid var(--border-soft);
  padding:8px 6px calc(var(--sab) + 8px);
}
.nav-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:none; color:var(--text-faint); padding:6px 2px; border-radius:12px;
  transition:transform 0.1s ease;
}
.nav-btn:active{ transform:scale(0.92); }
.nav-btn .icon{ width:21px; height:21px; }
.nav-btn span{ font-size:10px; font-weight:600; letter-spacing:0.01em; }
.nav-btn.active{ color:var(--canon); }
.nav-icon-wrap{ position:relative; display:inline-flex; }
.nav-badge{
  position:absolute; top:-5px; right:-9px; min-width:16px; height:16px; padding:0 4px;
  background:var(--alert); color:#fff; border-radius:999px;
  font-size:10px; font-weight:700; line-height:16px; text-align:center;
  box-shadow:0 0 0 2px var(--bg);
}
.section-pad{ padding:16px 18px 100px; flex:1; overflow-y:auto; }
.card{
  background:var(--surface-raised); border:1px solid var(--border-soft);
  border-radius:var(--radius-m); padding:14px 15px; margin-bottom:10px; box-shadow:var(--shadow);
  transition:transform 0.1s ease, opacity 0.1s ease;
  
  color:var(--text); font-family:inherit; text-align:inherit;
}
.fw-gallery-card{ content-visibility:auto; contain-intrinsic-size:auto 250px; }
.card-row{ display:flex; align-items:center; gap:12px; }
.pub-viewers-head{ display:flex; align-items:center; gap:6px; }
.pub-viewers-toggle{
  flex:1; display:flex; align-items:center; gap:8px; background:none; border:none; padding:0;
  cursor:pointer; color:var(--text-muted); font-size:11.5px; text-align:left;
}
.pub-viewers-toggle.section-toggle{
  font-family:var(--font-display); font-weight:700; font-size:13px; color:var(--canon);
}
.pub-viewers-toggle .icon{ transition:transform 0.2s ease; }
.pub-viewers-toggle.open .icon{ transform:rotate(180deg); }
.pub-viewers-body{ display:none; }
.pub-viewers-body.open{ display:block; }
.link-toggle-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:10px; }
.link-toggle-label{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--text); }
.link-toggle-label .icon{ color:var(--text-faint); flex-shrink:0; }
.link-toggle-seg{ width:112px; flex-shrink:0; }
.list-row{ display:flex; align-items:center; gap:12px; padding:13px 2px; border-bottom:1px solid var(--border-soft); cursor:pointer; }
.list-row:last-child{ border-bottom:none; }
.card-title{ font-family:var(--font-display); font-weight:600; font-size:15.5px; }
.card-title, .card-sub, .fw-gallery-name, .book-meta .b-title, .book-row-info .b-title,
.pub-title, .pub-penname, .pub-synopsis, .ov-section-label, #sheetContent h2{ overflow-wrap:anywhere; }
.card-sub{ font-size:12.5px; color:var(--text-muted); margin-top:2px; }
.pill{
  display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:99px;
  font-size:10.5px; font-weight:600; font-family:var(--font-mono); letter-spacing:0.02em;
}
.pill.canon{ background:var(--canon-soft); color:var(--canon-deep); }
.pill.voice{ background:var(--voice-soft); color:var(--voice-deep); }
.pill.alert{ background:var(--alert-soft); color:var(--alert-deep); }
.pill.status-ongoing{ background:var(--status-ongoing-soft); color:var(--status-ongoing-deep); }
.pill.status-hiatus{ background:var(--status-hiatus-soft); color:var(--status-hiatus-deep); }
.pill.neutral{ background:var(--surface); color:var(--text-muted); border:1px solid var(--border-soft); }
.fw-gallery{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; padding:4px 0 16px; }
.fw-gallery-card{
  position:relative; border-radius:16px; overflow:hidden; aspect-ratio:3/4;
  box-shadow:0 10px 22px -8px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.14);
  border:1px solid var(--border);
  transition:transform 0.12s ease; cursor:pointer;
}
.fw-gallery-card:active{ transform:scale(0.95); }
.fw-gallery-card.pub-fw-static:active{ transform:none; }
.fw-gallery-card img{ width:100%; height:100%; object-fit:cover; display:block; }
.fw-gallery-fallback{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:var(--surface); }
.fw-gallery-monogram{
  width:35%; aspect-ratio:1; max-width:76px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:var(--surface-raised); border:1.5px solid var(--border);
  font-family:var(--font-display); font-weight:700; font-size:clamp(20px,7vw,30px); color:var(--text-muted);
}
.fw-gallery-name{
  position:absolute; left:0; right:0; bottom:0; padding:12px 10px 10px;
  background:linear-gradient(transparent, rgba(0,0,0,.78));
  color:#fff; font-family:var(--font-display); font-weight:700; font-size:13.5px; line-height:1.25;
  
  overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
}
.fab{
  position:fixed; z-index:30; bottom:calc(var(--sab) + 84px); right:calc(50% - 260px + 20px);
  width:44px; height:44px; border-radius:50%; background:var(--canon); color:#fff;
  border:2px solid var(--bg);
  display:flex; align-items:center; justify-content:center;
  
  box-shadow:var(--shadow-lg), 0 0 0 1px rgba(0,0,0,0.22);
  transition:transform 0.1s ease;
}
.fab:active{ transform:scale(0.90); }
@media (max-width:600px){
.fab{ right:18px; }
}
.fab .icon{ width:19px; height:19px; }
.lx-lib.is-under{ -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 18px); mask-image:linear-gradient(to bottom, transparent 0, #000 18px); }
.shelf-list{ padding:10px 16px 90px; }
.book-row{
  display:flex; align-items:flex-start; gap:14px; padding:14px 4px;
  border-bottom:1px solid var(--border-soft);
  transition:transform 0.1s ease, opacity 0.1s ease;
}
.book-row:active{ transform:scale(0.98); opacity:0.8; }
.book-row-thumb{
  position:relative;
  width:76px; height:112px; border-radius:9px; overflow:hidden; flex-shrink:0;
  background:var(--surface); border:1px solid var(--border-soft);
  display:flex; align-items:center; justify-content:center; color:var(--text-faint);
  box-shadow:0 3px 10px -4px rgba(0,0,0,.22);
}
.book-row-thumb img{ width:100%; height:100%; object-fit:cover; object-position:center top; }
.book-row-info{ flex:1; min-width:0; padding-top:4px; }
.book-row-info .b-title{ font-family:var(--font-display); font-weight:700; font-size:16.5px; line-height:1.3; margin-bottom:6px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.book-row-stats{ display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-top:6px; font-family:var(--font-mono); font-size:11px; color:var(--text-faint); }
.book-row-stats .stat{ display:flex; align-items:center; gap:4px; }
.book-row-stats .stat .icon{ width:12px; height:12px; }
.sheet-backdrop{
  position:fixed; inset:0; background:rgba(20,17,10,0.45); z-index:50;
  display:none; align-items:flex-end; justify-content:center;
}
.sheet-backdrop.active{ display:flex; }
.sheet{
  width:100%; max-width:560px; background:var(--bg); border-radius:22px 22px 0 0;
  
  overflow-x:hidden;
  
  max-height:88vh; max-height:88dvh; overflow-y:auto; padding:18px 20px calc(var(--sab) + 24px);
  animation:sheetUp 0.25s cubic-bezier(.2,.8,.3,1) both; box-shadow:var(--shadow-lg);
}
.sheet-handle{
  width:38px; height:4px; border-radius:99px; background:var(--border); margin:0 auto 14px;
}
.sheet-sticky-top{ background:var(--bg); }
.sheet-sticky-bottom{
  flex:0 0 auto; background:var(--bg); padding-top:12px;
  padding-bottom:calc(var(--sab) + 18px);
  
  box-shadow:0 -8px 12px -8px rgba(0,0,0,0.12);
}
.sheet h2{ font-family:var(--font-display); font-size:20px; margin:0 0 14px; font-weight:600; }
.sheet.sheet--split{
  display:flex; flex-direction:column; overflow-y:hidden; padding-bottom:0;
}
.sheet--split .sheet-sticky-top{ flex:0 0 auto; }
.sheet-scroll-body{
  overflow-y:auto; overflow-x:hidden; flex:1 1 auto; min-height:0;
  padding-bottom:calc(var(--sab) + 24px);
  
  padding-left:4px; padding-right:4px; margin-left:-4px; margin-right:-4px;
  
  padding-top:8px;
}
.confirm-backdrop{
  position:fixed; inset:0; background:rgba(20,17,10,0.45); z-index:200;
  display:none; align-items:center; justify-content:center; padding:24px;
}
.confirm-backdrop.active{ display:flex; }
.confirm-dialog{
  width:100%; max-width:340px; background:var(--surface-raised); border-radius:18px;
  box-shadow:var(--shadow-lg);
  animation:confirmPop 0.2s cubic-bezier(.2,.8,.3,1) both;
  
  max-height:80vh; max-height:80dvh;
  display:flex; flex-direction:column; overflow:hidden;
}
.confirm-dialog-top{ flex:0 0 auto; padding:22px 20px 0; }
.confirm-dialog-scroll{ flex:1 1 auto; min-height:0; overflow-y:auto; padding:0 20px; }
.confirm-dialog-bottom{ flex:0 0 auto; padding:0 20px 18px; }
.confirm-title{ font-family:var(--font-display); font-weight:700; font-size:17px; color:var(--text); margin-bottom:8px; }

<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sheet-backdrop" id="sheetBackdrop"><div class="sheet" id="sheetContent" role="dialog" aria-modal="true"></div></div>
<div class="confirm-backdrop" id="confirmBackdrop"><div class="confirm-dialog" id="confirmDialog" role="dialog" aria-modal="true"></div></div>
<script>
/* PROJECT NOTE (Nemesis, single file)
   Done: M0 foundation (nemesis_db, Gemini adapter, backup). M1 Canon library, new-novel sheet, Ledger entries, AI proposals. M2 layered Plan with tier-gated approval and reject impact. M2.1 scope controls (target length, words per chapter, pacing). M3 prose preferences, story bible from the plan, Floor scene writing with versions and checks.
   M4: Knowledge ledger (facts plus who holds each one; approved facts only; the Writer is told what each character knows and what stays hidden; every scene is checked for early reveals and characters acting on things they never learned; knowledge rows follow approved scenes only). Repetition guard (the previous scene's ending and the chapter's earlier summaries go to the Writer; a code overlap check triggers one automatic rewrite, then a flag; the planner is told scenes in a chapter must differ). Checkpoint and resume (jobs_local). Button spacing fixes.
   M4.1: Style enforcement. One behavioural definition per style option (STYLE, styleBlock, proseBlock) now reaches the Writer, Fix flagged and the check; pacing reaches the Writer (it only shaped the plan before); the author's settings win over the voice guide; scene length is a range (wordMin/wordMax, chapterWords kept as the midpoint) with an end-when-done rule; the check judges style and one targeted revision runs only when a scene clearly drifts. Character profiles (voice, wants, manner, ties) live on character entities: Ending first requires approved profiles before a character's scenes are written, Discovery proposes them from the first scene a character appears in; Develop profiles drafts them from the plan; the planner is told to build scene purposes from what characters want. Knowledge drafting stops once the plan is covered (n.kbCovered), with a fuzzy duplicate filter; manual add always works.
   M4.1 caveats: whether the real model follows the new definitions is not yet judged on real output; style drift is an AI judgement and can be wrong, and is a soft flag that does not stop Autonomous approval; the fuzzy duplicate threshold (0.75 word overlap) is an untuned guess; a character with no entry in the story bible blocks Ending first writing until it is added or Develop profiles is run.
   M5: Before you write checklist (story bible, character profiles, knowledge) with tier behaviour: Hands-on presses each button, Guided drafts the cast when you press write and you approve in one tap, Autonomous prepares and approves it. Language level setting (Plain, Natural, Literary; default Natural) plus a clarity rule against showy words and list-like prose. Chapter reader, and manuscript export (Word, Markdown, web page) of approved scenes only. Offline install: manifest.webmanifest, sw.js and two icons sit beside index.html; bump CACHE in sw.js on every release.
   M5 caveats: the Word file is hand-built and checked with python-docx and LibreOffice, not with Microsoft Word; installability and system back behaviour need a real phone; the service worker is in Canon's style (network first for the page, 6 second wait before the saved copy opens, a newer build is detected by SHA-256 and announced; no CACHE bump for ordinary changes, bump SHELL_CACHE in sw.js only when its PRECACHE list changes), so a newer version shows after a reload; Google Fonts are cached after the first online visit.
   P0 (chapter word budget): the chapter range belongs to the whole chapter. Each scene is asked for what is left after the earlier scenes of its chapter, shared by the scenes still to write. A chapter that ends under its range is only shown in the reader pill, never rejected. Untuned: how closely Gemini follows the numbers.
   P1 (scene intelligence): after every scene Gemini is asked what the scene establishes (stage 1, one extra call, recordScene) and the app checks it (stage 2, reconcile): names matched to the bible, duplicates removed by content-derived ids, quoted evidence verified against the scene text, claims kept as claims, names not in the bible flagged. Saved in IndexedDB v2 stores scene_state (one per scene) and ledger (one row per item, rebuilt from the recorded state only while the scene is approved, removed when the text changes or the scene is not approved). Edits, fixes and restores re-record the scene. Existing approved scenes show "Record N scenes" on the Write tab. Before the first upgrade of an existing database a backup is offered. Untuned: how well Gemini fills each list. Not yet used by the Writer or the check: that is P2 (handoff and continuity validation).
   P2 (continuity): the Writer is given how the last scene ended, where people and objects stand, claims (labelled as claims, not facts) and time references, all from the ledger of approved scenes; the check gets the same and returns classified findings (error, mystery, conflict, unverified, possible), where an error without a quote found in the scene and something it conflicts with is downgraded to possible; the app adds its own checks (an object that changes hands with no event showing it, the same age or duration stated with a different number). Only errors stop Autonomous approval; the rest are notes. A name the bible does not know can be added as a character or place from where it is flagged. Untuned: false alarms from Gemini and from the app checks. POV and tense (P2b): the Writer gets operational definitions of first person, third limited and omniscient and of past and present tense, a viewpoint character per scene (book default in Prose preferences, override on the scene in the plan, else the first character in the scene) and a closing reminder that the plan and summaries are third-person notes; the check judges person, tense and viewpoint and a code guard counts I, me and my in the narration; one targeted rewrite fixes drift, and unresolved drift stops Autonomous approval. Tense is judged by Gemini only. P4 (characters and generation quality): profiles keep the four short fields and gain nine optional deep ones (beliefs, needs, flaws, reacts, decides, avoids, habits, history, arc); the planner, the Writer and the check read the same character text; each scene check can propose changes to a profile (evidence must be a line really in the scene), saved on the character as suggestions and applied only when the director presses Apply, never overwriting silently; stock gestures (nine families) are counted by code across the last three scenes and the Writer is told which to avoid; the last three openings are shown to the Writer and a third identical opening kind is noted; the check can note two voices that could be swapped. All of these are notes, none blocks approval. Untuned: gesture patterns and opening kinds are regexes and will miss variations; whether Gemini obeys the avoid lines is not yet judged on real output.
   P4.1 (calmer Writer, deeper entries): before each scene one extra call plans 5 to 8 beats (what happens, whose want drives it, what it delivers), the feel, and how each speaker sounds; the Writer follows them in order; they are saved on the scene, editable in the scene sheet and reused on Regenerate; a failed beat step never blocks writing. The Writer instructions were rewritten as positive principles (about 20 prohibitions instead of 31): people may be warm, funny or talkative, coldness is a choice, emotion through the whole person rather than close-ups of faces and joints; the dialogue Level examples no longer all clip. Characters gain a warmth field; places, factions, world rules, mysteries and themes gain optional deeper fields that the planner reads and the Writer reads when the scene plan names them. Deepen this entry, Deepen the cast and Deepen these (per category) return suggestions only (a field with 8 or more words is left alone) and nothing applies until Apply. Viewpoints card on the Floor (written and planned scenes per viewpoint, last chapter, display only) and a secondary viewpoint setting. KNOWN LIMITS (also in nemesis-known-limits.md): real Gemini output unjudged (beats quality, whether the warmer prompt fixes flat voices, false alarms in every check); tense judged by Gemini only; gesture, face-close-up and opening detection are regexes; strange sentences are only reduced by instruction, not detected in general; Writer ledger sees approved scenes only; Hands-on plans one chapter per run; character names match exactly; repetition guard is 5-word runs; one viewpoint character per scene; non-Chromium browsers untested.
   P3 (planning): chapters are planned one at a time (1, 3, 5 or 10 per run, default 1), each from the saved ones before it, with the previous chapter ending spelled out, character profiles, the last three chapter plans in detail and the recorded story state. Each chapter carries a plan document (purpose, opening, ending, events, wants, revelations, threads, open questions, timeline, dependencies), is validated (code rules plus one Gemini call; an error needs a line quoted from an earlier chapter, otherwise it is only possible), and is auto-approved only in Guided or Autonomous with no errors and a finished check. A run stops at the first chapter that needs review or fails and keeps what was saved. Untuned: validation false alarms.
   Phase 1 (story intelligence foundation, director-directive redesign): every memory record carries cls (established, approved, planned, hypothesis, belief), conf, prov, stale, draft and links, filled in one place (clsFill, on every database write). Written scenes, drafts included, feed the ledger and knowledge as soon as they are recorded (rows from a draft are marked draft). When a scene changes its rows are kept and marked out of date, then replaced when it is recorded again. A row marked Not true stays out of every prompt and stays out when rows are rebuilt. A suggestion is only ever counted again when it repeats, never promoted. Each entry sheet shows In the story so far (where, holds, last event, who knows or believes what, scenes, planned scenes), computed from the records. Schema 3 migration (n.schema) adds fields only, offers a backup first, and can run twice; no database version change. Not yet: protected decisions, decision queue, delegation (Phase 2), scene briefs (Phase 3), prose dimensions (Phase 4).
   Not built yet: clue and foreshadowing records, tension and twist tools, reader feedback, chapter review (M6), humanizer (M7).
   Known issues: fonts load from Google Fonts (fallback fonts offline) and JetBrains Mono is referenced but never loaded; Gemini key is sent as a ?key= URL parameter, same as Canon; keyboard resizing inside sheets and real-device back gestures are untested.
   Floor: chapters flagged Needs review can still be written; scenes are written in the foreground only, and an interrupted scene can be recovered after reload only if its text had already arrived; the avoid-list is phrase based; scene text cannot be exported yet.
   Knowledge: who-learned-what comes from an AI check, so it can miss or misjudge; only 25 approved facts go into each check; editing the text of an approved scene does not re-run the check; the repeat threshold (15% shared 5-word runs) is an untuned guess; one unsaved-scene checkpoint per novel; two tabs open at once are not handled.
   Plan: Plan more chapters retries once with a smaller batch of 5 when Gemini's reply is cut off or names no developments; malformed items in an AI plan response are skipped without a message; rejecting a plan item cannot be undone yet; plan prompts grow with the plan and are not measured at large sizes; Developing and Superseded statuses are not used yet.

const STORES={novels:[],entities:["novelId","kind"],facts:["entityId"],plan:["novelId","parentId"],chapters:["novelId"],scenes:["chapterId"],scene_versions:["sceneId"],propositions:["novelId"],knowledge:["propositionId","holder"],proposals:["novelId","status"],decisions:["novelId"],qa_findings:["sceneId"],jobs_local:["novelId"],scene_state:["novelId"],ledger:["novelId","sceneId","kind"]};

/* Before the first upgrade of an existing database the author is offered a backup. The upgrade only adds stores, but it is the one step that could harm saved novels. */
async function upgradeGuard(){
  try{
    if(!indexedDB.databases)return;
    const e=(await indexedDB.databases()).find(x=>x.name==="nemesis_db");if(!e||!(e.version<DBV))return;
    const old=await new Promise((res,rej)=>{const r=indexedDB.open("nemesis_db");r.onupgradeneeded=()=>{try{r.transaction.abort()}catch(x){}};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
    let has=0;try{if(old.objectStoreNames.contains("novels"))has=await new Promise((res,rej)=>{const q=old.transaction("novels","readonly").objectStore("novels").count();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(x){}
    if(!has){old.close();return}
    const dump=async()=>{const stores={};for(const nm of [...old.objectStoreNames])stores[nm]=await new Promise((res,rej)=>{const q=old.transaction(nm,"readonly").objectStore(nm).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
      const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({app:"nemesis",schema:1,exportedAt:new Date().toISOString(),settings:{},stores})],{type:"application/json"}));a.download="nemesis-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
    await new Promise(done=>{
      const o=document.createElement("div");o.id="upgGuard";o.setAttribute("role","dialog");o.setAttribute("aria-modal","true");o.setAttribute("aria-label","Storage update");
      o.style.cssText="position:fixed;inset:0;z-index:9999;background:var(--bg,#fff);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto";
      o.innerHTML='<div style="max-width:420px;width:100%"><h2 style="margin:0 0 10px">Nemesis is updating its storage</h2><p class="field-hint" id="upgMsg" style="margin:0 0 16px">This version adds records for each novel\'s story state. Your novels stay as they are. Save a backup first so you can restore everything if anything goes wrong.</p><div class="btn-row"><button class="btn primary" id="upgSave" type="button">Save backup</button></div><div class="btn-row"><button class="btn ghost" id="upgGo" type="button">Continue without a backup</button></div></div>';
      document.body.appendChild(o);
      o.querySelector("#upgSave").onclick=async()=>{try{await dump();o.querySelector("#upgMsg").textContent="Backup saved. You can continue.";o.querySelector("#upgGo").textContent="Continue";o.querySelector("#upgGo").className="btn primary";o.querySelector("#upgSave").className="btn ghost"}catch(x){o.querySelector("#upgMsg").textContent="The backup could not be saved. You can try again or continue."}};
      o.querySelector("#upgGo").onclick=()=>{o.remove();done()}});
    old.close()
  }catch(x){/* the upgrade only adds stores, so a failed guard must never stop the app from opening */}}
function openDB(){return _db||(_db=(async()=>{await upgradeGuard();return new Promise((res,rej)=>{
  const r=indexedDB.open("nemesis_db",DBV);
  r.onupgradeneeded=()=>{const d=r.result;for(const [n,ix] of Object.entries(STORES)){if(!d.objectStoreNames.contains(n)){const s=d.createObjectStore(n,{keyPath:"id"});ix.forEach(i=>s.createIndex(i,i))}}};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})})())}
async function tx(store,mode,fn){const d=await openDB();return new Promise((res,rej)=>{
  const t=d.transaction(store,mode);let out;const q=fn(t.objectStore(store));
  if(q)q.onsuccess=()=>{out=q.result};
  t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
const dbPut=(s,o)=>tx(s,"readwrite",st=>st.put(clsFill(s,o)));
const dbGet=(s,id)=>tx(s,"readonly",st=>st.get(id));
const dbDel=(s,id)=>tx(s,"readwrite",st=>st.delete(id));
const dbAll=s=>tx(s,"readonly",st=>st.getAll());
const dbBy=(s,ix,v)=>tx(s,"readonly",st=>st.index(ix).getAll(v));
const dbCount=s=>tx(s,"readonly",st=>st.count());
async function save(s,o){o.id=o.id||uid();o.createdAt=o.createdAt||Date.now();o.updatedAt=Date.now();await dbPut(s,o);return o}

async function exportAll(){

async function importAll(txt){
  let j;try{j=JSON.parse(txt)}catch(e){throw new Error("This is not a Nemesis backup file.")}
  if(!j||j.app!=="nemesis"||!j.stores||typeof j.stores!=="object")throw new Error("This is not a Nemesis backup file.");
  const names=Object.keys(STORES);

  const d=await openDB();
  await new Promise((res,rej)=>{const t=d.transaction(names,"readwrite");
    try{names.forEach(n=>{const s=t.objectStore(n);s.clear();(j.stores[n]||[]).forEach(o=>s.put(o))})}catch(e){try{t.abort()}catch(_){}return rej(e)}
    t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}

/* ---------- Gemini adapter (ported from Canon) ---------- */
const GBASE="https://generativelanguage.googleapis.com/v1beta/";
const BAD_MODEL=/embedding|aqa|tts|imagen|image|vision-only|live|robotics|computer-use|veo|lyria/i;
const cool={};
const ckey=(k,m)=>String(k).slice(-8)+"|"+m;
function coolGet(k){const c=cool[k]||(Settings.get().cooldowns||{})[k];return c&&c.until>Date.now()?c:null}
function coolSet(k,until,message){
  cool[k]={until,message};const s=Settings.get().cooldowns||{},n={};
  for(const x in s)if(s[x].until>Date.now())n[x]=s[x];
  n[k]={until,message};Settings.set({cooldowns:n})}
function clearCool(q){for(const k in cool)delete cool[k];Settings.set({cooldowns:{}});if(!q)toast("Quota cooldowns cleared")}

async function attempt(key,model,body,json,ms){
  const ck=ckey(key,model),c=coolGet(ck);
  if(c){const e=new Error(c.message);e.status=429;throw e}
  const b=Object.assign({},body);
  b.generationConfig=Object.assign({},body.generationConfig||{},{maxOutputTokens:json?16384:8192});
  if(json)b.generationConfig.responseMimeType="application/json";
  const ctrl=new AbortController(),t=setTimeout(()=>ctrl.abort(),ms||60000);let r;
  try{r=await fetch(GBASE+"models/"+model+":generateContent?key="+encodeURIComponent(key),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b),signal:ctrl.signal})}
  catch(e){if(e.name==="AbortError"){const x=new Error("Gemini model "+model+" timed out");x.timedOut=true;throw x}throw e}
  finally{clearTimeout(t)}
  if(!r.ok){
    const bt=await r.text().catch(()=>""),e=new Error("Gemini "+r.status+": "+bt.slice(0,600));e.status=r.status;
    if(r.status===429){const m=bt.match(/"retryDelay":\s*"(\d+)s"/);coolSet(ck,Date.now()+(m?+m[1]:60)*1000,e.message)}
    throw e}
  const d=await r.json(),cand=(d.candidates&&d.candidates[0])||{},parts=(cand.content&&cand.content.parts)||[];
  return{text:parts.filter(p=>p.text&&!p.thought).map(p=>p.text).join(""),truncated:cand.finishReason==="MAX_TOKENS"}}

async function listModels(key){
  const r=await fetch(GBASE+"models?key="+encodeURIComponent(key));
  if(!r.ok)throw new Error("Could not list Gemini models ("+r.status+")");
  return(await r.json()).models||[]}
function rank(ms){
  const names=[...new Set(ms.filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace(/^models\//,"")))];
  const sc=n=>{let s=0;
    if(/flash/i.test(n))s+=10;if(/pro/i.test(n))s-=4;if(/lite/i.test(n))s-=8;
    if(BAD_MODEL.test(n))s-=30;if(/preview/i.test(n))s-=1;if(/^gemini-\d/.test(n))s+=2;
    const v=n.match(/gemini-(\d+(?:\.\d+)?)/i);if(v)s+=parseFloat(v[1])*3;return s};
  return names.sort((a,b)=>sc(b)-sc(a))}

/* generate(prompt,{system,temperature,json}) -> {model,text,truncated} */
async function generate(prompt,o){
  o=o||{};const S=Settings.get(),key=S.geminiKey;
  if(!key)throw new Error("No Gemini API key set");
  const body={contents:[{parts:[{text:prompt}]}]};
  if(o.system)body.systemInstruction={parts:[{text:o.system}]};
  if(o.temperature!=null)body.generationConfig={temperature:o.temperature};
  const json=!!o.json;
  const done=(m,r)=>{if(S.modelMode!=="fixed"&&S.workingModel!==m)Settings.set({workingModel:m});return Object.assign({model:m},r)};
  if(S.modelMode==="fixed"&&S.preferredModel){
    for(let i=0;;i++){
      try{return done(S.preferredModel,await attempt(key,S.preferredModel,body,json,o.timeoutMs))}
      catch(e){if(e.status>=500&&e.status<600&&i<2){await new Promise(r=>setTimeout(r,2000*(i+1)));continue}
        throw new Error("FIXED_MODEL_FAILED::"+S.preferredModel+"::"+e.message)}}}
  const tried=new Set();let first=null;
  for(const m of [S.preferredModel,S.workingModel]){
    if(!m||tried.has(m))continue;tried.add(m);
    try{return done(m,await attempt(key,m,body,json,o.timeoutMs))}catch(e){first=e}}
  let cands;
  try{cands=rank(await listModels(key))}catch(e){throw new Error("Could not reach Gemini. Check your API key. ("+e.message+")")}
  if(!cands.length)throw new Error("No Gemini models available for this key");
  let last=first,stalled=first&&first.timedOut?1:0;
  for(const m of cands){
    if(tried.has(m))continue;tried.add(m);
    try{return done(m,await attempt(key,m,body,json,o.timeoutMs||(stalled?30000:60000)))}
    catch(e){last=e;if(e.timedOut&&++stalled>=2)break}}
  throw new Error("No available Gemini model worked for this key. Last error: "+(last?last.message:"unknown"))}

function parseJson(t){
  const c=t.trim().replace(/^```(?:json)?\s*/i,"").replace(/\s*```$/,"");
  try{return JSON.parse(c)}catch(e){
    const a=c.search(/[\[{]/),z=Math.max(c.lastIndexOf("}"),c.lastIndexOf("]"));
    if(a>=0&&z>a)return JSON.parse(c.slice(a,z+1));throw e}}
/* generateJson retries once on bad or truncated output -> {data,model} */
async function generateJson(prompt,o){
  let last;
  for(let i=0;i<((o&&o.tries)||2);i++){
    const r=await generate(i?prompt+"\n\nReturn only valid JSON, no commentary.":prompt,Object.assign({},o,{json:true}));
    try{if(r.truncated)throw new Error("output was cut off");return{data:parseJson(r.text),model:r.model}}catch(e){last=e}}
  throw new Error(/cut off/.test(last.message)?"Gemini reply was cut off before it finished":"Could not parse Gemini response as JSON ("+last.message+")")}

function humanize(err){
  const m=String((err&&err.message)||err||""),f=m.match(/^FIXED_MODEL_FAILED::(.*?)::([\s\S]*)$/);
  if(f)return "Your fixed model ("+f[1]+") did not work: "+humanize(new Error(f[2]))+" Switch to Automatic in Settings to let Nemesis pick.";
  if(/No Gemini API key/i.test(m))return "Add a Gemini API key in Settings first.";
  if(/API key not valid|INVALID_ARGUMENT/i.test(m))return "Your Gemini API key looks invalid. Check it in Settings.";
  if(/PERMISSION_DENIED|Gemini 40[13]/i.test(m))return "This key does not have permission for that. Check it in Settings.";
  if(/RESOURCE_EXHAUSTED|Gemini 429|quota/i.test(m))return /PerDay/i.test(m)?"Today's free limit for this model is used up. It resets around midnight Pacific time. Another model or key may still have room.":"Too many requests in a minute. Wait about a minute and try again.";
  if(/timed out/i.test(m))return "Gemini did not answer in time. Try again, or pick a Flash model in Settings.";
  if(/Gemini 5\d\d/.test(m))return "Gemini had a server hiccup. Try again shortly.";
  if(/Failed to fetch|NetworkError/i.test(m))return "Could not reach Gemini. Check your connection.";
  if(/No available Gemini model|No Gemini models/i.test(m))return "This key cannot reach a working Gemini model. Check it in Settings.";
  if(/cut off/i.test(m))return "Gemini's reply was cut off before it finished. Try again.";
  if(/none named a development/i.test(m))return "Gemini's chapters did not name the developments they advance, so none were saved. Try again.";
  if(/no usable items/i.test(m))return "Gemini's reply had nothing Nemesis could use. Try again.";
  if(/as JSON/i.test(m))return "Gemini replied in an unexpected format. Try again.";
  return "Something went wrong reaching Gemini. ["+m.slice(0,140)+"]"}

function toastKind(msg){

const STYLE={
 pace:{
  fast:`Pacing: FAST. Move efficiently through the meaningful developments. Cut intermediate steps, routine movement and repeated observation, and summarise them in a clause. Once the scene's change has landed, end the scene. Fast means efficient progression, not merely short sentences, and characters and atmosphere still get a beat. Level: "Elias spotted the blood beneath the doorway. Someone had passed through recently. He drew his sword and entered."`,
  balanced:`Pacing: BALANCED. Balance action, observation, dialogue and development. Include an intermediate step only when it carries meaning or tension. Level: "Elias approached the doorway and noticed the blood beneath it. He crouched, touched the trail and found it still wet. Someone had passed through recently."`,
  slow:`Pacing: SLOW. Let moments unfold gradually, with more attention to observation, atmosphere and intermediate beats. Every beat must still carry meaning or tension: slow never means padding or meaningless activity. Level: "Elias approached the doorway cautiously. He examined the damaged frame, then the floor around it. A thin trail of blood ran beneath the threshold. He crouched and touched it with two fingers. It was still wet."`},
 density:{
  lean:`Description: LEAN. Give the essential visual or sensory fact and move on. Ordinary actions and objects get a clause at most. Level: "The corridor was narrow and poorly lit. Elias moved towards the exit."`,
  balanced:`Description: BALANCED. Give enough detail to establish the place and give the scene texture, usually one or two concrete details, without expanding ordinary actions or objects. Do not drift towards richer description as the scene goes on. Level: "The narrow corridor was lit by two flickering emergency lamps. Elias stepped around a broken pipe and continued towards the exit."`,
  rich:`Description: RICH. Give fuller visual, environmental and sensory detail where the setting or mood deserves attention, and stop each description once it has done its job. Level: "The corridor narrowed ahead, its concrete walls stained by years of moisture. Two emergency lamps flickered overhead, casting uneven patches of light across the broken pipes and scattered debris. Elias stepped over a length of exposed cable, listening to the faint electrical buzz above him."`},
 figurative:{
  sparse:`Figurative language: SPARSE. Default to direct, concrete language. Metaphor, simile and personification should be uncommon and used only where they clearly improve the moment, and never the stock atmospheric kind (shadows that dance or whisper, silence that is heavy, air thick with tension, hearts that hammer, eyes like pools). Emotion still comes through action and specific detail, so the prose is not flat. Level: "The creature struck the wall. Concrete fragments scattered across the floor."`,
  moderate:`Figurative language: MODERATE. Use figurative language occasionally, where it adds to the imagery or the emotional effect. Keep each figure fresh and clear, not stock. Level: "The creature struck the wall hard enough to send concrete fragments scattering across the floor like broken glass."`,
  rich:`Figurative language: RICH. Allow expressive and more frequent figurative language while keeping it clear and original. Vary the kind of image, never repeat one, and do not make every sentence a figure. Level: "The creature crashed into the wall, and the concrete burst apart beneath its weight. Fragments scattered across the floor like the remains of a shattered monument."`},
 monologue:{
  rare:`Inner thoughts: MINIMAL. Keep internal narration largely absent. Show reactions through action and observable behaviour, and do not explain obvious reactions or name what a character feels. Level: "Elias saw the creature approaching. He stepped aside."`,
  moderate:`Inner thoughts: MODERATE. Allow a relevant observation or a short reflection, a line or two at a time, only where it adds something the action does not. Never explain the meaning of what just happened or restate a reaction the reader already saw. Level: "The creature approached. Elias stepped aside, remembering how quickly the last one had crossed the room. He couldn't afford to underestimate this one."`,
  frequent:`Inner thoughts: DEEP. Allow extended internal reasoning, reflection, emotional processing and weighing of alternatives where the moment calls for it, but do not turn every action into a monologue: return to action. Level: "The creature approached. Elias stepped aside, remembering how quickly the last one had crossed the room. His previous strategy had depended on distance, but that advantage was gone now. He needed another way to keep it away from him."`},
 dialogue:{
  sparse:`Dialogue: MINIMAL. Keep exchanges brief and direct, with only the essential lines. Characters still differ in how they speak. Level: "Three coming," Miller said. Marcus nodded. "Then we go. Good eyes, Miller."`,
  balanced:`Dialogue: BALANCED. Natural conversational exchanges with room for personality, reaction and context. Level: "Three coming," Miller said, glancing at the corridor. Marcus laughed under his breath. "How far?" "Close." "Then stop whispering and help me with this door."`,
  heavy:`Dialogue: EXPRESSIVE. Allow more distinctive voices, humour, conversational rhythm and expressive exchanges where it suits the scene. Level: "Three coming through the eastern corridor," Miller said, lowering his voice. Marcus looked towards the darkness. "How close?" "Close enough that I'd rather not wait around to count their teeth." "You always did know how to cheer a man up." Miller grinned. "It's a gift. Now move."`},
 rhythm:{
  short:`Sentence rhythm: SIMPLE. Prefer straightforward, clear constructions, mostly short and medium sentences. Vary the openings and the length so it never turns monotonous or list-like. Level: "Elias entered the room. The creature stood by the broken pillar and turned towards him. He raised his sword."`,
  mixed:`Sentence rhythm: MIXED. Combine short, medium and longer sentences naturally, and let the content choose the length. Level: "Elias entered the room and stopped. The creature stood beside the broken pillar, its head turning towards him. He raised his sword."`,
  long:`Sentence rhythm: COMPLEX. Allow layered sentences with subordinate clauses and extended description where it suits the moment, but keep every sentence easy to follow and use a short sentence when impact needs it. Level: "Elias entered the room, slowing as he noticed the creature standing beside the broken pillar, its movements almost imperceptible beneath the uneven flicker of the emergency lights."`}};
const STYLE_REG={
  plain:`Language level: PLAIN. Write the way a clear, popular storyteller speaks: everyday words and short, direct sentences. If a common word fits, use it, and never use a word that most readers would need a dictionary for. Say what happens plainly. Level: "Elias checked the straps on his chest guard. One was fraying. He tied it off and looked over at Marcus."`,
  natural:`Language level: NATURAL. Write the way a good commercial novel reads: ordinary, clear vocabulary with the occasional vivid word. Avoid showy or rare words, and technical jargon the story has not already explained. Never put two uncommon words in one sentence. The reader should follow every line at one reading. Level: "Elias tugged at the frayed strap on his chest guard. It would hold for one more day, probably."`,
  literary:`Language level: LITERARY. A richer, more precise vocabulary and a more crafted voice are allowed, but each uncommon word must earn its place and clarity still comes first. Level: "Elias worked a thumb along the frayed strap of his chest guard, weighing whether it would outlast the shift."`};

/* Offline install: the service worker caches the app shell only. Gemini calls are never cached. */
/* ---------- P1: scene intelligence. Stage 1: Gemini extracts what a scene establishes. Stage 2: the application checks it,
   removes duplicates, flags what it cannot vouch for, and owns what is saved. Records live in two stores:
   scene_state (one per scene: the extraction for one version of the text) and ledger (one row per recorded item, joined only when the scene is approved). */
const LKINDS=[["place","Places"],["object","Objects"],["event","Events"],["relation","Relations"],["claim","Claims"],["time","Time"],["question","Questions"],["person","Names"]];
const LCAP={place:10,object:12,event:10,relation:8,claim:10,time:10,question:6,people:15};
const hashS=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return(h>>>0).toString(36)};
const nrm=s=>String(s==null?"":s).toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
const STOPN=new Set(["","he","she","they","it","i","me","we","you","him","her","them","nobody","no one","someone","everyone","anyone","unknown","narrator","the narrator","none","n a","na"]);
/* a name in the scene to a bible entry: exact, or one whose words contain the other's (Arthur and Arthur Hayes), never when that is ambiguous */
function entFor(ents,name){
  const q=nrm(name);if(!q||STOPN.has(q))return null;
  const ex=ents.find(e=>nrm(e.name)===q);if(ex)return ex;
  const qt=q.split(" "),c=ents.filter(e=>{const et=nrm(e.name).split(" ");return qt.every(w=>et.includes(w))||et.every(w=>qt.includes(w))});
  return c.length===1?c[0]:null}
/* is a quoted line really in the scene? exact, or most of its three-word runs appear */
function evOk(ev,tn){
  const en=nrm(ev);if(en.length<8)return false;if(tn.includes(en))return true;
  const w=en.split(" ");if(w.length<4)return false;let k=0,n=0;for(let i=0;i+3<=w.length;i++){n++;if(tn.includes(w.slice(i,i+3).join(" ")))k++}return n>0&&k/n>=.6}
function normExtract(d){
  const a=k=>Array.isArray(d&&d[k])?d[k]:[],c=(v,n)=>clip(v,n),ev=x=>c(x&&x.evidence,200);
  const o={
    places:a("places").map(x=>({who:c(x&&x.who,60),where:c(x&&x.where,100),ev:ev(x)})).filter(x=>x.who&&x.where).slice(0,LCAP.place),
    objects:a("objects").map(x=>({item:c(x&&x.item,80),holder:c(x&&x.holder,80),state:c(x&&x.state,120),ev:ev(x)})).filter(x=>x.item&&(x.holder||x.state)).slice(0,LCAP.object),
    events:a("events").map(x=>({what:c(x&&x.what,220),who:arr0(x&&x.who).map(v=>c(v,60)).filter(Boolean).slice(0,6),ev:ev(x)})).filter(x=>x.what).slice(0,LCAP.event),
    relations:a("relations").map(x=>({a:c(x&&x.a,60),b:c(x&&x.b,60),change:c(x&&x.change,200),ev:ev(x)})).filter(x=>x.a&&x.b&&x.change).slice(0,LCAP.relation),
    claims:a("claims").map(x=>({speaker:c(x&&x.speaker,60),text:c(x&&x.text,220),status:["claimed","confirmed","disputed"].includes(x&&x.status)?x.status:"claimed",ev:ev(x)})).filter(x=>x.speaker&&x.text).slice(0,LCAP.claim),
    time:a("time").map(x=>({text:c(x&&x.text,160),about:c(x&&x.about,80),ev:ev(x)})).filter(x=>x.text).slice(0,LCAP.time),
    questions:a("questions").map(x=>c(x&&typeof x==="object"?x.text:x,200)).filter(Boolean).slice(0,LCAP.question),
    people:a("people").map(x=>c(x&&typeof x==="object"?x.name:x,60)).filter(Boolean).slice(0,LCAP.people),
    ending:c(d&&d.ending,400)};
  return o}
const exCount=x=>x?["places","objects","events","relations","claims","time","questions"].reduce((a,k)=>a+arr0(x[k]).length,0):0;
/* stage 2: the extraction becomes ledger rows. Ids are derived from the content, so the same item can never be stored twice for a scene. */
function reconcile(ex,ents,text,meta){
  const tn=nrm(text),rows=new Map(),at=Date.now();
  const add=(kind,subject,txt,o)=>{
    const id=meta.sceneId+":"+kind+":"+hashS(kind+"|"+nrm(subject)+"|"+nrm(txt));if(rows.has(id)||!has(txt))return;
    const ev=o.ev&&evOk(o.ev,tn)?clip(o.ev,200):"",bad=!!o.ev&&!ev,e=entFor(ents,subject);
    rows.set(id,{id,novelId:meta.novelId,sceneId:meta.sceneId,recId:meta.recId,versionId:meta.versionId,kind,subject:clip(subject,80),subjectId:e?e.id:null,text:clip(txt,240),value:o.value||"",
      /* no quoted line means the item is inferred, a quote that is not in the scene is unverified, and a claim stays a claim */
      status:bad?"unverified":(o.status||(ev?"fact":"inferred")),evidence:ev,storyOrder:meta.storyOrder,review:bad?"pending":"ok",why:bad?"The quoted line was not found in the scene text.":"",prov:{origin:"scene",ref:meta.recId,at},
      cls:(kind==="claim"&&(o.status||"claimed")!=="confirmed")?"belief":"established",conf:bad?"low":(ev?"high":"medium"),verifiedAt:ev?at:0,stale:false,draft:!!meta.draft,links:linksFor(ents,subject,o.names)})};
  arr0(ex.places).forEach(x=>add("place",x.who,x.where,{ev:x.ev,value:x.where,names:[x.who]}));
  arr0(ex.objects).forEach(x=>add("object",x.item,(x.holder||"")+(x.holder&&x.state?" (":"")+(x.state||"")+(x.holder&&x.state?")":""),{ev:x.ev,value:x.holder,names:[x.holder]}));
  arr0(ex.events).forEach(x=>add("event",x.who.join(", "),x.what,{ev:x.ev,names:x.who}));
  arr0(ex.relations).forEach(x=>add("relation",x.a+" and "+x.b,x.change,{ev:x.ev,names:[x.a,x.b]}));
  arr0(ex.claims).forEach(x=>add("claim",x.speaker,x.text,{ev:x.ev,status:x.status,names:[x.speaker]}));
  arr0(ex.time).forEach(x=>add("time",x.about,x.text,{ev:x.ev,names:[x.about]}));
  arr0(ex.questions).forEach(q=>add("question","",q,{}));
  /* a person the story bible does not know. This is how a name that quietly changes (Arthur becoming Thomas) shows up. */
  const nm=new Map();
  [].concat(arr0(ex.people),arr0(ex.places).map(x=>x.who),arr0(ex.events).flatMap(x=>x.who),arr0(ex.relations).flatMap(x=>[x.a,x.b]),arr0(ex.claims).map(x=>x.speaker)).forEach(v=>{const k=nrm(v);if(k&&!STOPN.has(k)&&!entFor(ents,v)&&!nm.has(k))nm.set(k,clip(v,60))});
  [...nm.values()].slice(0,6).forEach(v=>{const id=meta.sceneId+":person:"+hashS(nrm(v));rows.set(id,{id,novelId:meta.novelId,sceneId:meta.sceneId,recId:meta.recId,versionId:meta.versionId,kind:"person",subject:v,subjectId:null,text:"Not in the story bible",value:"",status:"unresolved",evidence:"",storyOrder:meta.storyOrder,review:"pending",why:"No character, place or faction with this name is in the story bible.",prov:{origin:"scene",ref:meta.recId,at},cls:"hypothesis",conf:"low",verifiedAt:0,stale:false,draft:!!meta.draft,links:[]})});
  return[...rows.values()]}
async function standingLines(n,so){
  const rows=(await dbBy("ledger","novelId",n.id)).filter(r=>(r.kind==="place"||r.kind==="object")&&r.storyOrder<so&&r.review!=="dismissed"&&r.review!=="rejected"),latest=new Map();
  rows.sort((a,b)=>a.storyOrder-b.storyOrder).forEach(r=>latest.set(r.kind+"|"+nrm(r.subject),r));
  return[...latest.values()].slice(-14).map(r=>"- "+r.subject+": "+r.text)}
const EXSCHEMA='{"places":[{"who":"","where":"","evidence":""}],"objects":[{"item":"","holder":"","state":"","evidence":""}],"events":[{"what":"","who":[""],"evidence":""}],"relations":[{"a":"","b":"","change":"","evidence":""}],"claims":[{"speaker":"","text":"","status":"claimed","evidence":""}],"time":[{"text":"","about":"","evidence":""}],"questions":[""],"people":[""],"ending":""}';
/* stage 1 */
async function recordScene(n,D,s,text){
  try{

    const cast=ents.filter(isChar).map(e=>e.name),places=ents.filter(e=>e.kind==="places").map(e=>e.name);
    const r=await generateJson("Task: Record the scene.\nRecord what this scene establishes so the novel's records stay accurate. Record only what the scene itself shows or says. Never invent, never explain, never resolve a mystery. What a character says is a claim, not a fact, unless the narration itself confirms it. Use the exact name from the cast list when a listed person is meant, and any other named person exactly as written in the scene. Name the narrator by name. For each item give a short evidence quote copied word for word from the scene (under 25 words), or an empty string if there is none.\n\nCast: "+(cast.join(", ")||"(none listed)")+"\nPlaces: "+(places.join(", ")||"(none listed)")
     +(pst&&pst.ending?"\n\nHow the previous scene ended: "+pst.ending:"")+(stand.length?"\n\nRecorded so far (latest state):\n"+stand.join("\n"):"")
     +"\n\nScene (chapter "+D.co[s.parentId].order+", "+s.title+"):\n"+clip(text,9000)
     +"\n\nReturn JSON: "+EXSCHEMA+"\nplaces: where each named character is when the scene ends. objects: important objects, documents and evidence, and who holds each or where it is when the scene ends. events: the key things that happen, one sentence each. relations: relationships that start, change or end. claims: statements about the past or about others that matter to the plot; status is claimed, confirmed (the narration confirms it) or disputed (contradicted in the scene). time: every date, age, duration or time reference as written, with who or what it is about. questions: questions the scene leaves open. people: every named person in the scene. ending: one or two sentences saying where everyone is, what they hold and what is unresolved when the scene ends. Use empty lists where there is nothing.",

const GEST=[["drum","drumming fingers",/\b(?:drum|drummed|drumming|drums)\b[^.!?]{0,30}?\b(?:fingers?|table|desk|armrest|surface)\b|\bfingers?\b[^.!?]{0,20}?\b(?:drummed|drumming|tapped)\b/],
 ["grip","tightening hands or fingers",/\b(?:hands?|fingers?|knuckles?|grip)\b[^.!?]{0,25}?\b(?:tighten|clench|whiten)\w*|\b(?:clenched|tightened) (?:his|her|their) (?:fists?|hands?|fingers?)\b/],
 ["jaw","jaw tightening",/\bjaw\b[^.!?]{0,25}?\b(?:tighten|clench|set|tensed|rigid|hardened|lock)\w*|\b(?:tightened|clenched|set|locked) (?:his|her|their) jaw\b/],
 ["arms","crossed arms",/\b(?:crossed|folded) (?:his|her|their) arms\b|\barms (?:crossed|folded)\b/],
 ["voice","a flat or measured voice",/\b(?:his|her|their) (?:flat|measured|even|level|neutral|steady) (?:voice|tone)\b|\b(?:in|with) a (?:flat|measured|even|level|neutral) (?:voice|tone)\b|\bvoice (?:was|came|stayed|remained) (?:flat|measured|even|level)\b/],
 ["breath","a held or released breath",/\b(?:let out|released|exhaled|drew|took) a (?:slow |long |deep |shaky |steadying )?breath\b|\bheld (?:his|her|their) breath\b|\ba breath (?:he|she|they) (?:didn't|hadn't|had not)\b/],
 ["swallow","swallowing hard",/\bswallowed (?:hard|thickly)\b|\bthroat (?:tightened|constricted)\b/],
 ["eyes","narrowing or flickering eyes",/\beyes (?:narrowed|flickered|widened)\b|\b(?:narrowed|flickered) (?:his|her|their) eyes\b/],

 ["face","close-ups of faces and joints",/\b(?:jaw|cheek|temple|brow|lip|knuckle|tendon|vein|muscle)s?\b[^.!?]{0,25}?\b(?:flex|twitch|lock|tick|bulg|ripple|work|clench|tighten)\w*|\b(?:saw|watched|noticed|caught) (?:his|her|their) \w+ (?:\w+ )?(?:lock|tighten|flex|tense|twitch|harden)\w*/],
 ["smile","a smile that does not reach the eyes",/\bsmile that (?:didn't|did not) reach\b|\b(?:faint|small|thin) smile (?:touched|tugged|played)\b/]];
const gestCount=t=>{const o={};GEST.forEach(g=>{const m=String(t||"").match(new RegExp(g[2].source,"gi"));if(m)o[g[0]]=m.length});return o};

  const past=gestPast(priors),l=GEST.filter(g=>past[g[0]]).map(g=>g[1]+" ("+past[g[0]]+")");
  return l.length?"\n\nThese gestures were already used in the last few scenes: "+l.join(", ")+". Do not use them again. Show a feeling another way: through the rhythm of what is said, hesitation or silence, avoiding a subject, a choice that surprises, or a habit that belongs to this character alone. Do not swap in another stock gesture.":""}

   interpretation; belief = what a character says, knows or believes (never objective truth); craft and preference are reserved for later phases. */
const SCHEMA=3;
const CLSL={established:"Shown in the story",approved:"Approved by you",planned:"Planned",hypothesis:"Suggestion",belief:"Belief or claim",craft:"Craft note",preference:"Your preference"};
/* The one place a class is decided for a record that has none. A suggestion becomes approved only when its status says you approved it. */
function clsFill(s,o){
  if(!o||typeof o!=="object"||!["entities","facts","plan","propositions","knowledge","ledger","proposals"].includes(s))return o;
  if(s==="plan"){if(!o.cls)o.cls="planned";return o}
  if(s==="knowledge"){if(!o.cls)o.cls="belief";return o}
  if(s==="ledger"){if(!o.cls)o.cls=(o.kind==="claim"&&o.status!=="confirmed")?"belief":(o.kind==="person"?"hypothesis":"established");return o}
  if(o.status==="approved"&&(!o.cls||o.cls==="hypothesis"))o.cls="approved";
  else if(!o.cls)o.cls="hypothesis";
  return o}
const rowConf=r=>r.status==="unverified"||r.kind==="person"?"low":(r.evidence?"high":"medium");
/* a person or place a ledger row touches: its subject plus every named participant */
const linksFor=(ents,subject,names)=>{const out=new Set(),a=entFor(ents,subject);if(a)out.add(a.id);arr0(names).forEach(v=>{const e=entFor(ents,v);if(e)out.add(e.id)});return[...out]};
/* ---------- the ledger follows the written scene ---------- */
/* Written (drafted or approved) scenes feed memory as soon as their story state is recorded. Rows from a draft are marked draft. When the text
   of a scene changes, its rows are kept and marked stale (out of date) until the scene is recorded again, then replaced. A row you marked
   Not true stays out of memory whenever the rows are rebuilt. */
async function syncLedger(rec){
  const st=await dbGet("scene_state",rec.planId),old=await dbBy("ledger","sceneId",rec.planId),written=rec.status==="approved"||rec.status==="drafted";
  if(!rec.currentVersionId){if(old.length)await dbTx(old.map(r=>["del","ledger",r.id]));return}
  if(written&&st&&st.status==="recorded"&&st.versionId===rec.currentVersionId){
    const ents=await dbBy("entities","novelId",rec.novelId),text=await textOf(rec),decs=(await dbBy("decisions","novelId",rec.novelId)).filter(d=>d.targetType==="ledger"),
     dis=new Set(decs.filter(d=>d.decision==="deliberate").map(d=>d.targetId)),bad=new Set(decs.filter(d=>d.decision==="wrong").map(d=>d.targetId)),
     back=new Set(decs.filter(d=>d.decision==="restored").map(d=>d.targetId)),
     nw=reconcile(st.extract,ents,text,{novelId:rec.novelId,sceneId:rec.planId,recId:rec.id,versionId:rec.currentVersionId,storyOrder:rec.chOrder*1000+rec.scOrder,draft:rec.status!=="approved"}),keep=new Set(nw.map(r=>r.id)),ops=[];
    old.forEach(r=>{if(!keep.has(r.id))ops.push(["del","ledger",r.id])});
    nw.forEach(r=>{if(dis.has(r.id))r.review="dismissed";if(bad.has(r.id)&&!back.has(r.id))r.review="rejected";ops.push(["put","ledger",stamp(r)])});
    if(ops.length)await dbTx(ops);return}
  /* the text moved on or the scene is not written: keep the rows, but never present them as current */
  const ops=old.filter(r=>!r.stale).map(r=>["put","ledger",Object.assign({},r,{stale:true,staleAt:Date.now()})]);
  if(ops.length)await dbTx(ops)}
/* ---------- what the story says about one entry, computed from the records (never stored, so it cannot go stale) ---------- */
async function memoryOf(n,e){
  const all=(await dbBy("ledger","novelId",n.id)).filter(r=>r.review!=="rejected"&&r.kind!=="person").sort((a,b)=>a.storyOrder-b.storyOrder),mine=r=>r.subjectId===e.id||arr0(r.links).includes(e.id);
  const row=all.filter(mine),lastOf=k=>{const l=row.filter(r=>r.kind===k);return l[l.length-1]||null};
  const items=new Map();all.filter(r=>r.kind==="object").forEach(r=>items.set(nrm(r.subject),r));
  const holds=[...items.values()].filter(r=>has(r.value)&&sameNm(r.value,e.name)),
   props=new Map((await dbBy("propositions","novelId",n.id)).map(p=>[p.id,p])),kn=(await dbBy("knowledge","holder",e.id)).sort((a,b)=>(a.storyOrder||0)-(b.storyOrder||0)),
   know=new Map();kn.forEach(k=>know.set(k.propositionId,k));
  const sceneIds=new Set(row.map(r=>r.sceneId)),pl=(await dbBy("plan","novelId",n.id)).filter(x=>x.layer===5&&x.status!=="rejected"&&arr0(x.participants).some(p=>sameNm(p,e.name))),
   written=new Set((await dbAll("scenes")).filter(r=>r.novelId===n.id&&r.currentVersionId).map(r=>r.planId));
  return{where:lastOf("place"),holds,event:lastOf("event"),relation:lastOf("relation"),
   knows:[...know.values()].filter(k=>k.stance==="knows").map(k=>props.get(k.propositionId)).filter(Boolean),
   thinks:[...know.values()].filter(k=>k.stance!=="knows").map(k=>({p:props.get(k.propositionId),k})).filter(x=>x.p),
   scenes:sceneIds.size,kinds:LKINDS.map(k=>[k[1],row.filter(r=>r.kind===k[0]).length]).filter(x=>x[1]),
   planned:pl.filter(x=>!written.has(x.id)).length}}
const tagOf=r=>r?(r.stale?" (out of date, the scene changed)":r.draft?" (from a draft)":""):"";
async function entMemoryHtml(e){
  try{
    const n=await dbGet("novels",S.novelId),m=await memoryOf(n,e);
    if(!m.scenes&&!m.planned&&!m.knows.length&&!m.thinks.length)return'<div class="field"><label>In the story so far</label><div class="field-hint" style="margin:0">Nothing written about this yet.</div></div>';
    const ln=(t,r)=>'<div style="padding:6px 0;border-top:1px solid var(--border-soft);font-size:13.5px"><span class="card-sub" style="margin:0 8px 0 0">'+t+'</span>'+(r?esc(r.text)+' <span class="field-hint" style="margin:0">'+whereLbl(r.storyOrder)+tagOf(r)+'</span>':"")+'</div>';
    let h='<div class="field"><label>In the story so far</label><div class="field-hint" style="margin:0 0 4px">Worked out from the written scenes. What a character knows or believes is kept apart from what is true.</div>';
    if(isChar(e)){
      if(m.where)h+=ln("Where",m.where);
      m.holds.slice(0,5).forEach(r=>{h+=ln("Holds",Object.assign({},r,{text:r.subject+": "+r.text}))});
      if(m.event)h+=ln("Last event",m.event);
      if(m.relation)h+=ln("Relationship",m.relation);
      m.knows.slice(0,4).forEach(p=>{h+='<div style="padding:6px 0;border-top:1px solid var(--border-soft);font-size:13.5px"><span class="card-sub" style="margin:0 8px 0 0">Knows</span>'+esc(clip(p.text,160))+'</div>'});
      m.thinks.slice(0,4).forEach(x=>{h+='<div style="padding:6px 0;border-top:1px solid var(--border-soft);font-size:13.5px"><span class="card-sub" style="margin:0 8px 0 0">'+(x.k.stance==="suspects"?"Suspects":"Believes")+'</span>'+esc(clip(x.k.believedValue||x.p.text,160))+'</div>'})}
    h+='<div class="field-hint" style="margin:6px 0 0">'+(m.scenes?'Appears in '+m.scenes+' written scene'+(m.scenes===1?'':'s')+(m.kinds.length?': '+m.kinds.map(x=>x[1]+' '+(x[1]===1?x[0].toLowerCase().replace(/s$/,""):x[0].toLowerCase())).join(", "):"")+'.':"Not in a written scene yet.")+(m.planned?' Planned, not written yet: '+m.planned+' scene'+(m.planned===1?'':'s')+'.':'')+'</div></div>';
    return h}catch(x){return""}}
/* ---------- migration to schema 3: fields only, nothing removed, safe to run twice ---------- */
async function askBackup(){
  return new Promise(done=>{
    const o=document.createElement("div");o.id="schGuard";o.setAttribute("role","dialog");o.setAttribute("aria-modal","true");o.setAttribute("aria-label","Story records update");
    o.style.cssText="position:fixed;inset:0;z-index:9999;background:var(--bg,#fff);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto";
    o.innerHTML='<div style="max-width:420px;width:100%"><h2 style="margin:0 0 10px">Nemesis is updating your story records</h2><p class="field-hint" id="schMsg" style="margin:0 0 16px">Every record in your novels is being labelled by where it came from: shown in the story, approved by you, planned, a suggestion or a belief. Nothing is removed or rewritten. Save a backup first so you can restore everything if anything goes wrong.</p><div class="btn-row"><button class="btn primary" id="schSave" type="button">Save backup</button></div><div class="btn-row"><button class="btn ghost" id="schGo" type="button">Continue without a backup</button></div></div>';
    document.body.appendChild(o);
    o.querySelector("#schSave").onclick=async()=>{try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([await exportAll()],{type:"application/json"}));a.download="nemesis-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);o.querySelector("#schMsg").textContent="Backup saved. You can continue.";o.querySelector("#schGo").textContent="Continue";o.querySelector("#schGo").className="btn primary";o.querySelector("#schSave").className="btn ghost"}catch(x){o.querySelector("#schMsg").textContent="The backup could not be saved. You can try again or continue."}};
    o.querySelector("#schGo").onclick=()=>{o.remove();done()}})}
async function migrateNovel(n){
  const ents=await dbBy("entities","novelId",n.id),ops=[],fill=(s,o)=>{const b=o.cls;clsFill(s,o);if(o.cls!==b)ops.push(["put",s,o])};
  for(const e of ents){fill("entities",e);for(const f of await dbBy("facts","entityId",e.id))fill("facts",f)}
  for(const x of await dbBy("plan","novelId",n.id))fill("plan",x);
  for(const p of await dbBy("propositions","novelId",n.id))fill("propositions",p);
  for(const k of await dbAll("knowledge"))if(!k.cls&&((await dbGet("propositions",k.propositionId))||{}).novelId===n.id)fill("knowledge",k);
  for(const r of await dbBy("ledger","novelId",n.id)){
    let ch=false;if(!r.cls){clsFill("ledger",r);ch=true}
    if(!r.conf){r.conf=rowConf(r);ch=true}
    if(r.verifiedAt===undefined){r.verifiedAt=r.evidence?(r.prov&&r.prov.at)||0:0;ch=true}
    if(r.stale===undefined){r.stale=false;ch=true}
    if(r.draft===undefined){r.draft=false;ch=true}
    if(!r.links){r.links=linksFor(ents,r.subject,[r.value]);ch=true}
    if(ch)ops.push(["put","ledger",r])}
  for(let i=0;i<ops.length;i+=400)await dbTx(ops.slice(i,i+400));
  /* scenes that were written but never approved now feed memory as well */
  for(const rec of (await dbAll("scenes")).filter(r=>r.novelId===n.id&&r.status==="drafted")){try{
    if(!(await dbBy("ledger","sceneId",rec.planId)).length)await syncLedger(rec);
    if(!(await dbAll("knowledge")).some(k=>k.sceneId===rec.planId))await syncKnowledge(rec)}catch(x){}}
  n.schema=SCHEMA;n.migratedAt=Date.now();await save("novels",n);return ops.length}
async function schemaGuard(quiet){
  const ns=(await dbAll("novels")).filter(n=>(n.schema||0)<SCHEMA);if(!ns.length)return 0;
  let content=false;for(const n of ns){if((await dbBy("entities","novelId",n.id)).length||(await dbBy("plan","novelId",n.id)).length){content=true;break}}
  if(content&&!quiet)await askBackup();
  let c=0;for(const n of ns){try{c+=await migrateNovel(n)}catch(x){}}
  return c}

try{if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
  /* one notice per page load, whichever signal arrives first: the service worker saying a newer build finished downloading, or a new sw.js installing */
  let told=false;const upd=()=>{if(told)return;told=true;toast("A newer version is ready. Reload Nemesis to use it.","info")};
  navigator.serviceWorker.addEventListener("message",e=>{if(e.data&&e.data.type==="nemesis-update-ready")upd()});
  addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").then(reg=>{reg.addEventListener("updatefound",()=>{const w=reg.installing;if(w)w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)upd()})})}).catch(()=>{})})}}catch(e){}
const boot=()=>{if(history.state&&history.state.sheet){history.back()}else{S=history.state||S;history.replaceState(S,"");render()}};
schemaGuard().then(boot,boot);
